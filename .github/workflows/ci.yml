name: CI
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and libass
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install minimal app dependencies
        run: pip install 'fastapi>=0.115,<1' 'python-multipart>=0.0.9,<1' 'uvicorn>=0.30,<1'
      - name: Static compile check
        run: python -m compileall -q app.py
      - name: Tests
        run: python -m unittest discover -s tests -v
